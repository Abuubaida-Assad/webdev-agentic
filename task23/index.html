<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <!-- Centered Converter Card -->
  <main class="w-full max-w-md bg-white rounded-xl shadow-md p-6 sm:p-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Temperature Converter</h1>
      <p class="text-sm text-gray-600">Convert temperatures between Celsius, Fahrenheit, and Kelvin.</p>
    </div>

    <!-- Converter Form -->
    <form id="converter-form" class="space-y-4">
      
      <!-- Temperature Input Field -->
      <div>
        <label for="temp-input" class="block text-sm font-medium text-gray-700 mb-1">
          Enter Temperature
        </label>
        <input
          type="number"
          step="any"
          id="temp-input"
          placeholder="Enter temperature value"
          class="w-full px-3.5 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition"
          required
        />
      </div>

      <!-- Unit Select Dropdowns Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        
        <!-- From Dropdown -->
        <div>
          <label for="from-unit" class="block text-sm font-medium text-gray-700 mb-1">
            From
          </label>
          <select
            id="from-unit"
            class="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition cursor-pointer"
            required
          >
            <option value="" disabled selected>Select unit</option>
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>

        <!-- To Dropdown -->
        <div>
          <label for="to-unit" class="block text-sm font-medium text-gray-700 mb-1">
            To
          </label>
          <select
            id="to-unit"
            class="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition cursor-pointer"
            required
          >
            <option value="" disabled selected>Select unit</option>
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>

      </div>

      <!-- Convert Button (Initially Disabled) -->
      <button
        type="submit"
        id="convert-btn"
        disabled
        class="w-full py-2.5 px-4 bg-blue-600 text-white font-medium rounded-lg text-sm transition duration-150 shadow-sm cursor-pointer hover:bg-blue-700 active:bg-blue-800 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed disabled:shadow-none"
      >
        Convert
      </button>

    </form>

    <!-- Error Message Display -->
    <div id="error-message" class="hidden mt-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-medium rounded-lg text-center">
      <!-- Error text injected by JS -->
    </div>

    <!-- Result Display Container -->
    <div id="result-container" class="hidden mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg text-center">
      <p class="text-xs uppercase tracking-wider text-blue-600 font-semibold mb-1">Converted Result</p>
      <p id="result-text" class="text-xl sm:text-2xl font-bold text-gray-900"></p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>

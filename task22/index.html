<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reddit Feed Reader</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#F5F5F5] text-gray-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Logo / Branding -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-[#FF4500] flex items-center justify-center text-white font-bold text-lg shadow-sm">
          r/
        </div>
        <div>
          <h1 class="text-lg font-bold text-gray-900 tracking-tight leading-none">Reddit Feed Reader</h1>
          <p class="text-xs text-gray-500">Multi-subreddit live lane dashboard</p>
        </div>
      </div>

      <!-- Add Subreddit Form -->
      <form id="add-subreddit-form" class="w-full sm:w-auto flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
        <div class="relative flex-1 sm:w-64">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 font-medium text-sm select-none">
            r/
          </span>
          <input
            type="text"
            id="subreddit-input"
            placeholder="e.g. javascript"
            autocomplete="off"
            class="w-full pl-8 pr-3 py-2 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#FF4500] focus:border-[#FF4500] focus:bg-white transition"
          />
        </div>
        <button
          type="submit"
          id="add-btn"
          class="px-4 py-2 bg-[#FF4500] hover:bg-[#E03D00] active:bg-[#CC3700] text-white text-sm font-semibold rounded-lg shadow-sm transition duration-150 cursor-pointer flex items-center justify-center gap-1.5"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>Add Subreddit</span>
        </button>
      </form>

    </div>

    <!-- Global Alert / Error Notification Banner -->
    <div id="nav-error" class="hidden bg-red-50 border-t border-red-200 px-4 py-2 text-xs text-red-700 font-medium flex items-center justify-between">
      <span id="nav-error-text"></span>
      <button type="button" id="dismiss-nav-error" class="text-red-500 hover:text-red-700 font-bold ml-2">✕</button>
    </div>
  </header>

  <!-- Main Feed Area: Subreddit Lanes Container -->
  <main class="flex-1 p-4 overflow-hidden flex flex-col">
    <!-- Horizontal Scrolling Lanes Container -->
    <div
      id="lanes-container"
      class="flex-1 flex flex-col sm:flex-row gap-4 overflow-y-auto sm:overflow-y-hidden sm:overflow-x-auto pb-2 items-stretch"
    >
      <!-- Subreddit lane cards dynamically generated by script.js -->
    </div>

    <!-- Empty State (When all lanes are removed) -->
    <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center p-8">
      <div class="w-16 h-16 rounded-full bg-orange-100 text-[#FF4500] flex items-center justify-center text-2xl font-bold mb-3">
        r/
      </div>
      <h2 class="text-lg font-bold text-gray-800 mb-1">No Subreddit Lanes</h2>
      <p class="text-sm text-gray-500 max-w-sm mb-4">You have removed all subreddit lanes. Enter a subreddit name in the bar above to get started.</p>
      <button
        id="restore-defaults-btn"
        type="button"
        class="px-4 py-2 text-xs font-semibold text-[#FF4500] bg-orange-50 hover:bg-orange-100 border border-orange-200 rounded-lg transition"
      >
        Restore Default Subreddits
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
